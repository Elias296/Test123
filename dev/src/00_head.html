<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tintenwerk">
<meta name="theme-color" content="#F8F9FA">
<meta name="format-detection" content="telephone=no">
<title>Tintenwerk</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
/* ===== Design-System: Alabaster, weiße Karten mit 1px-Rahmen, Tintenblau ===== */
:root{
  --bg:#F8F9FA; --card:#FFFFFF; --line:#E5E7EB; --line-2:#D1D5DB; --fill:#F1F3F5;
  --blue:#1E3A8A; --blue-d:#172554; --blue-soft:#EEF2FF;
  --amber:#B45309; --warn-bg:#FEF3C7; --warn-fg:#92400E; --warn-line:#FCD34D;
  --text:#111827; --muted:#6B7280; --ok:#15803D; --ok-soft:#DCFCE7; --err:#B91C1C;
  --r:14px; --r-s:10px; --tap:44px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,h4,p{margin:0}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Top-Navigation ---------- */
.topbar{flex:0 0 60px;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;flex:none;border-radius:10px;background:var(--blue);display:grid;place-items:center}
.title-input{flex:1 1 80px;min-width:60px;max-width:320px;height:var(--tap);border:1px solid transparent;border-radius:var(--r-s);background:transparent;padding:0 10px;font-size:16px;font-weight:600;letter-spacing:-.1px;text-overflow:ellipsis}
.title-input::placeholder{color:#9CA3AF;font-weight:500}
.title-input:hover{background:var(--fill)}
.title-input:focus{outline:none;border-color:var(--blue);background:#fff}
.actions{display:flex;align-items:center;gap:4px;justify-content:flex-end}

/* Segmented Control */
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{min-height:var(--tap);padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14.5px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#E5E7EB;font-size:12px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(17,24,39,.06)}
.seg button.on .n{background:var(--blue);color:#fff}
.seg.fill{display:flex;width:100%}.seg.fill button{flex:1;padding:0 6px}
.seg.small button{font-size:14px}

/* Buttons */
.icon-btn{width:var(--tap);height:var(--tap);flex:none;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;color:#374151}
.icon-btn:hover{background:var(--fill)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.btn{min-height:var(--tap);padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--text)}
.btn:active{background:var(--fill)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover,.btn-primary:active{background:var(--blue-d);border-color:var(--blue-d)}
.btn-amber{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-amber:active{background:var(--blue-d)}
.btn-ghost{background:transparent;border-color:transparent;color:#374151}
.btn-ghost:hover{background:var(--fill)}
.btn-danger{color:var(--err);border-color:#F3C6C6;background:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:0 12px;font-size:14px}
.cta{padding:0 18px;margin-left:6px}
.info{width:var(--tap);height:var(--tap);margin:-10px -10px -10px 0;flex:none;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:#9CA3AF}
.info:hover,.info[aria-expanded=true]{color:var(--blue)}

/* ---------- Hauptbereich ---------- */
.subtabs{display:none;padding:8px 14px 0}
main{flex:1 1 auto;min-height:0;display:flex}
.panel{flex:0 0 clamp(420px,40vw,580px);min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border-right:1px solid var(--line);background:var(--bg)}
.panel>section{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;min-height:24px;margin-bottom:12px}
.card-h h3{font-size:16px;font-weight:700;letter-spacing:-.1px}
.card h3{font-size:16px;font-weight:700}
.one{color:var(--muted);font-size:13.5px;margin:-6px 0 12px}
.card.stage-card{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.lbl:first-child{margin-top:0}
textarea,.field{width:100%;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-size:16px}
textarea{padding:12px 13px;resize:vertical;line-height:1.45}
.field{min-height:var(--tap);padding:0 12px}
textarea:focus,.field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
#editor{min-height:300px}
#stagingText{min-height:180px}
.hint{font-size:13px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:#166534}.badge.off{background:var(--fill);color:var(--muted)}.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.warnbox .chars,.infobox .chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chars span{background:#fff;border:1px solid var(--warn-line);border-radius:7px;padding:2px 8px;font-size:15px;min-width:28px;text-align:center;color:var(--text)}
.infobox{background:var(--blue-soft);color:var(--blue);border:1px solid #C7D2FE;border-radius:12px;padding:10px 12px;font-size:13.5px}
.infobox .chars span{border-color:#C7D2FE}
.progress{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .2s}
.progress.thin{height:4px}
.radio{display:flex;gap:12px;align-items:center;min-height:56px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:#fff;cursor:pointer}
.radio input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex:none}
.radio.on{border-color:var(--blue);background:#F8FAFF;box-shadow:0 0 0 1px var(--blue)}
.radio.disabled{opacity:.5}
.radio b{font-weight:600}
.radio small{display:block;color:var(--muted);font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:48px;height:48px;border-radius:50%;border:2px solid transparent;background:transparent;padding:0;display:grid;place-items:center}
.swatch i{display:block;width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch.on{border-color:var(--blue)}
.switch{display:flex;align-items:center;gap:12px;min-height:var(--tap);cursor:pointer;font-size:15px}
.switch input{width:24px;height:24px;accent-color:var(--blue);flex:none;margin:0}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.checks:empty{display:none}
.checks li{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.checks li .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:var(--ok);margin-top:1px}
.checks li.bad .ic{background:var(--err)}.checks li.warn .ic{background:#D97706}
.checks li small{display:block;color:var(--muted);font-size:12px;word-break:break-word}
details.fold{border-top:1px solid var(--line);margin:14px -16px -16px;padding:0 16px}
details.fold>summary{list-style:none;min-height:48px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600;color:#374151}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid #9CA3AF;border-bottom:2px solid #9CA3AF;transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(-135deg)}
details.fold>.fold-body{padding:0 0 16px}
details.fold:not(:last-child){margin-bottom:0}
details.fold+details.fold{margin-top:0}
pre.log{white-space:pre-wrap;word-break:break-word;background:var(--fill);border-radius:10px;padding:8px 10px;margin:8px 0 0;font:11.5px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);min-height:20px}
pre.log:empty{display:none}

/* Handschrift-Kacheln: 6er-Raster, fertige Zeichen mit grünem Rahmen und Punkt */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1;min-height:var(--tap);border:1px solid var(--line-2);border-radius:12px;background:#fff;display:grid;place-items:center;padding:0;font-size:22px;color:#9CA3AF;overflow:hidden}
.tile.done{border:1.5px solid #4ADE80;background:#FBFEFC;color:var(--text)}
.tile.done::after{content:"";position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tile .lab{position:absolute;left:6px;top:3px;font-size:10.5px;color:var(--muted);font-weight:600}
.tile svg.pv{width:74%;height:74%;margin-top:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px;font-size:13px;font-weight:600;color:#374151}
.grp-h span{font-weight:500;color:var(--muted);font-size:12.5px}

/* ---------- Vorschau: ruhige, gepunktete Arbeitsfläche ---------- */
.stage{flex:1 1 auto;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background-color:#F3F4F6;background-image:radial-gradient(#D5D9DF 1px,transparent 1.2px);background-size:20px 20px}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:28px 28px 96px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.sheet{margin:auto;flex:none;background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(17,24,39,.06),0 6px 24px rgba(17,24,39,.10);position:relative}
.sheet canvas{display:block;width:100%;height:100%;border-radius:2px}
.pill{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;border-radius:999px;padding:4px;z-index:5;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 4px 16px rgba(17,24,39,.08)}
.pill .icon-btn{border-radius:50%}
.pill .lab{min-width:78px;height:var(--tap);border:0;background:transparent;border-radius:999px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;padding:0 8px}
.pill .lab:hover{background:var(--fill)}
.pill span.lab{display:grid;place-items:center;min-width:64px}
.pill .sep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* ---------- Info-Popover ---------- */
.pop{position:fixed;z-index:400;width:min(340px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(17,24,39,.18);padding:14px 16px;font-size:13.5px;color:#374151}
.pop h4{font-size:14px;color:var(--text);margin-bottom:6px}
.pop p{margin:0 0 8px}.pop p:last-child{margin:0}
.pop ul{margin:0 0 8px;padding-left:18px}.pop li{margin:3px 0}
.pop code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:12.5px}

/* ---------- Modale Fenster ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.4);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.modal-card{background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px rgba(17,24,39,.28);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-card.wide{width:min(1080px,100%);height:min(820px,100%)}
.modal-card.mid{width:min(680px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);background:#fff}
.modal-head h2{font-size:17px;font-weight:700;flex:1;min-width:0}
.modal-head h2 small{font-weight:500;color:var(--muted);font-size:13.5px;margin-left:6px}
.modal-body{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.modal-body h4{margin:18px 0 6px;font-size:14.5px}
.modal-body h4:first-child{margin-top:0}
.modal-body p,.modal-body li{font-size:14px;color:#374151}
.modal-body ul,.modal-body ol{margin:6px 0;padding-left:20px}
.modal-body li{margin:3px 0}
.modal-body code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:12.5px}
.modal-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:#fff}

/* Zuschneiden */
.crop-stage{flex:1 1 auto;min-height:0;background:#1F2937;display:grid;place-items:center;overflow:hidden;position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-wrap{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.crop-wrap img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none}
.crop-rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(17,24,39,.6);touch-action:none;cursor:move}
.crop-rect::before{content:"";position:absolute;inset:0;background:linear-gradient(#fff6,#fff6) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.66%/100% 1px no-repeat;pointer-events:none}
.ch{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;touch-action:none;display:grid;place-items:center;z-index:2}
.ch::after{content:"";width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.ch[data-h=nw]{left:0;top:0;cursor:nwse-resize}.ch[data-h=n]{left:50%;top:0;cursor:ns-resize}.ch[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.ch[data-h=w]{left:0;top:50%;cursor:ew-resize}.ch[data-h=e]{left:100%;top:50%;cursor:ew-resize}
.ch[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.ch[data-h=s]{left:50%;top:100%;cursor:ns-resize}.ch[data-h=se]{left:100%;top:100%;cursor:nwse-resize}

/* Zeichenfeld */
.draw-wrap{display:flex;gap:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.draw-pad{position:relative;width:320px;height:320px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line-2);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
.draw-pad canvas{position:absolute;inset:0;width:320px;height:320px;touch-action:none;-webkit-user-select:none;user-select:none}
.draw-side{flex:1 1 200px;min-width:200px;max-width:260px;display:flex;flex-direction:column;gap:8px}
.bigchar{font-size:54px;font-weight:300;line-height:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.legend{font-size:13px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.legend i{display:block;width:22px;height:0;border-top:2px solid #C9D2E3}
.legend i.base{border-color:#DC2626}.legend i.dash{border-top-style:dashed}

/* Vergleichsansichten */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1 1 auto;min-height:0;padding:14px 16px}
.cmp>div{display:flex;flex-direction:column;min-height:0}
.cmp h4{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;min-height:24px}
.cmp textarea{flex:1 1 auto;min-height:160px;resize:none}
.cmp textarea[readonly]{background:var(--fill)}
.cmp-warn{margin:12px 16px 0}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;background:#111827;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:min(560px,92vw);text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;flex:none}
.spin.dark{border-color:rgba(30,58,138,.25);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- iPad Hochformat / schmale Fenster ---------- */
@media (max-width:1000px){
  .seg.steps button .t-long{display:none}
  .cta{padding:0 14px}
}
@media (min-width:1001px){.seg.steps button .t-short{display:none}}
@media (max-width:900px){
  .subtabs{display:block}
  main{display:block;position:relative}
  .panel{position:absolute;inset:0;flex:none;width:auto;border-right:0;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .stage{position:absolute;inset:0}
  main[data-view=panel] .stage{visibility:hidden;pointer-events:none}
  main[data-view=stage] .panel{display:none}
  .title-input{max-width:200px}
  .topbar{gap:8px;padding:0 10px}
  .seg.steps button{padding:0 10px}
}
@media (max-width:640px){
  .topbar{grid-template-columns:auto auto 1fr}
  .title-input{display:none}
  .seg.steps button .t-short{display:none}
  .cmp{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>
