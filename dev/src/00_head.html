<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tintenwerk">
<meta name="theme-color" content="#F2EFE9">
<meta name="format-detection" content="telephone=no">
<title>Tintenwerk</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root{
  --bg:#F2EFE9; --glass:rgba(255,255,255,.88); --line:#E2DDD5; --blue:#1E3A8A; --blue-d:#172554;
  --amber:#D97706; --warn-bg:#FEF3C7; --warn-fg:#92400E; --text:#1C1917; --muted:#57534E;
  --ok:#15803D; --err:#B91C1C; --shadow:0 8px 30px rgba(0,0,0,.06); --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,p{margin:0}
svg{display:block}

/* ---------- Top-Navigation ---------- */
.topbar{flex:0 0 60px;height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 0}
.brand .logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--blue);display:grid;place-items:center;box-shadow:0 2px 8px rgba(30,58,138,.28)}
.brand .name{font-weight:700;font-size:17px;letter-spacing:-.2px;flex:none}
.title-input{flex:1 1 60px;min-width:60px;max-width:280px;height:44px;border:1px solid transparent;border-radius:10px;background:transparent;padding:0 10px;font-size:15px;color:var(--muted);text-overflow:ellipsis}
.title-input:hover{border-color:var(--line)}
.title-input:focus{outline:none;border-color:var(--blue);background:#fff;color:var(--text)}
.seg{display:inline-flex;background:#E9E5DD;border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{min-height:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.seg button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(87,83,78,.14);font-size:12px}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg button.on .n{background:var(--blue);color:#fff}
.seg.small button{min-height:44px;padding:0 12px;font-size:13.5px}
.seg.fill{display:flex;width:100%}.seg.fill button{flex:1;justify-content:center;padding:0 6px}
.actions{display:flex;align-items:center;gap:2px;flex:0 0 auto;justify-content:flex-end}
.icon-btn{width:44px;height:44px;flex:none;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:rgba(0,0,0,.05)}
.icon-btn:disabled{opacity:.32;cursor:default;background:transparent}
.btn{min-height:44px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--text)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(30,58,138,.25)}
.btn-primary:hover,.btn-primary:active{background:var(--blue-d);border-color:var(--blue-d)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn-ghost{background:transparent}
.btn-danger{color:var(--err);border-color:#F1C7C7;background:#fff}
.btn-block{display:flex;width:100%}
.cta{margin-left:6px;white-space:nowrap}
.cta .long{display:inline}.cta .short{display:none}

/* ---------- Hauptbereich ---------- */
.subtabs{display:none;padding:8px 14px 0}
main{flex:1 1 auto;min-height:0;display:flex}
.panel{flex:0 0 clamp(380px,35vw,440px);min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(20px + env(safe-area-inset-bottom)) 14px;display:flex;flex-direction:column;gap:12px}
.panel>section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.card.stage-card{border:1.5px solid var(--amber);background:#FFFBF2}
.card.stage-card h3{color:#9A5B06}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
label.lbl,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 5px;letter-spacing:.1px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;resize:vertical;font-size:15px;line-height:1.45}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,58,138,.12)}
#editor{min-height:240px}
#stagingText{min-height:170px;border-color:#EBCB95}
.hint{font-size:12.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:#EEF2FF;color:var(--blue)}
.badge.ok{background:#DCFCE7;color:#166534}.badge.off{background:#F1EEE8;color:var(--muted)}.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border:1px solid #FCD34D;border-radius:12px;padding:10px 12px;font-size:13.5px}
.warnbox b{font-weight:700}
.warnbox .chars{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.warnbox .chars span{background:#fff;border:1px solid #FCD34D;border-radius:7px;padding:2px 8px;font-size:15px;min-width:28px;text-align:center}
.infobox{background:#EEF2FF;color:#1E3A8A;border:1px solid #C7D2FE;border-radius:12px;padding:10px 12px;font-size:13px}
.progress{height:8px;border-radius:99px;background:#E9E5DD;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .2s}
.progress.amber>i{background:var(--amber)}
.radio{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.radio input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--blue);flex:none}
.radio.on{border-color:var(--blue);background:#F5F7FF}
.radio.disabled{opacity:.5}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:transparent;padding:4px;display:grid;place-items:center}
.swatch i{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch.on{border-color:var(--blue)}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--blue)}
.checks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;font-size:13.5px;align-items:flex-start}
.checks li .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:var(--ok);margin-top:1px}
.checks li.bad .ic{background:var(--err)}.checks li.warn .ic{background:var(--amber)}
.checks li small{display:block;color:var(--muted);font-size:12px;word-break:break-word}

/* Handschrift-Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.tile{position:relative;aspect-ratio:1;min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;padding:0;font-size:22px;color:#A8A29E;overflow:hidden}
.tile.done{color:var(--text);border-color:#BBD7C4;background:#FBFEFB}
.tile .lab{position:absolute;left:5px;top:2px;font-size:10.5px;color:var(--muted);font-weight:600}
.tile .chk{position:absolute;right:4px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.tile svg.pv{width:78%;height:78%;margin-top:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 7px;font-size:13px;font-weight:700}
.grp-h span{font-weight:600;color:var(--muted);font-size:12px}

/* ---------- Vorschau-Atelier ---------- */
.stage{flex:1 1 auto;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}
.stage-top{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none;padding:0 12px;flex-wrap:wrap}
.stage-top>*{pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow)}
.stage-top .seg{border:1px solid var(--line);box-shadow:var(--shadow);background:rgba(233,229,221,.9)}
.chip{display:inline-flex;align-items:center;height:50px;padding:0 14px;border-radius:12px;font-size:13px;color:var(--muted);font-weight:600}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;padding:72px 24px 80px}
.sheet-scroll{touch-action:pan-x pan-y;overscroll-behavior:contain}
.sheet{margin:auto;flex:none;background:#fff;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 36px rgba(60,50,30,.16);position:relative}
.sheet canvas{display:block;width:100%;height:100%;border-radius:3px}
.pager{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;border-radius:999px;padding:3px;z-index:5}
.pager .icon-btn{border-radius:50%}
.pager span{min-width:118px;text-align:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- Modale Fenster ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(28,25,23,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.modal-card{background:#FBFAF7;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.28);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-card.wide{width:min(1080px,100%);height:min(820px,100%)}
.modal-card.mid{width:min(680px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line);background:#fff}
.modal-head h2{font-size:17px;font-weight:700;flex:1;min-width:0}
.modal-head h2 small{font-weight:600;color:var(--muted);font-size:13px;margin-left:6px}
.modal-body{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.modal-body h4{margin:16px 0 6px;font-size:14px}
.modal-body h4:first-child{margin-top:0}
.modal-body p,.modal-body li{font-size:14px;color:#3F3A36}
.modal-body ul,.modal-body ol{margin:6px 0;padding-left:20px}
.modal-body li{margin:3px 0}
.modal-body code{background:#F1EEE8;border-radius:5px;padding:1px 5px;font-size:12.5px}
.modal-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);background:#fff}

/* Zuschneiden */
.crop-stage{flex:1 1 auto;min-height:0;background:#2B2826;display:grid;place-items:center;overflow:hidden;position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
.crop-wrap{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.crop-wrap img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none}
.crop-rect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(20,18,16,.58);touch-action:none;cursor:move}
.crop-rect::before{content:"";position:absolute;inset:0;background:linear-gradient(#fff6,#fff6) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff6,#fff6) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff6,#fff6) 0 66.66%/100% 1px no-repeat;pointer-events:none}
.ch{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;touch-action:none;display:grid;place-items:center;z-index:2}
.ch::after{content:"";width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.ch[data-h=nw]{left:0;top:0;cursor:nwse-resize}.ch[data-h=n]{left:50%;top:0;cursor:ns-resize}.ch[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.ch[data-h=w]{left:0;top:50%;cursor:ew-resize}.ch[data-h=e]{left:100%;top:50%;cursor:ew-resize}
.ch[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.ch[data-h=s]{left:50%;top:100%;cursor:ns-resize}.ch[data-h=se]{left:100%;top:100%;cursor:nwse-resize}

/* Zeichenfeld */
.draw-wrap{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.draw-pad{position:relative;width:320px;height:320px;flex:none;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:inset 0 1px 4px rgba(0,0,0,.05);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
.draw-pad canvas{position:absolute;inset:0;width:320px;height:320px;touch-action:none;-webkit-user-select:none;user-select:none}
.draw-side{flex:1 1 200px;min-width:200px;max-width:260px;display:flex;flex-direction:column;gap:8px}
.bigchar{font-size:54px;font-weight:300;line-height:1;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:14px;background:#fff}
.legend{font-size:12.5px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.legend i{display:block;width:22px;height:0;border-top:2px solid #C9D2E3}
.legend i.base{border-color:#DC2626}.legend i.dash{border-top-style:dashed}

/* KI-Vergleich */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1 1 auto;min-height:0;padding:14px 16px}
.cmp>div{display:flex;flex-direction:column;min-height:0}
.cmp h4{font-size:13px;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.cmp textarea{flex:1 1 auto;min-height:160px;resize:none}
.cmp textarea[readonly]{background:#F6F4EF}
.cmp-warn{margin:12px 16px 0}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:300;background:#1C1917;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:min(560px,92vw);text-align:center}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;flex:none}
.spin.dark{border-color:rgba(30,58,138,.25);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- iPad Hochformat / schmale Fenster: Tab-Wechsel ---------- */
@media (max-width:1090px){
  .brand .name{display:none}
  .seg.steps button .t-long{display:none}
  .cta .long{display:none}.cta .short{display:inline}
}
@media (min-width:1091px){.seg.steps button .t-short{display:none}}
@media (max-width:900px){
  .subtabs{display:block}
  main{display:block;position:relative}
  .panel{position:absolute;inset:0;flex:none;width:auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
  .stage{position:absolute;inset:0}
  main[data-view=panel] .stage{visibility:hidden;pointer-events:none}
  main[data-view=stage] .panel{display:none}
  .title-input{max-width:150px}
  .topbar{gap:8px;padding:0 10px}
  .seg.steps button{padding:0 10px}
}
@media (max-width:640px){
  .title-input{display:none}
  .seg.steps button .t-short{display:none}
  .cmp{grid-template-columns:1fr}
}
</style>
</head>
